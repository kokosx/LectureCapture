name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  bundle:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LectureCapture ${{ github.ref_name }}"
          releaseBody: "Instalatory dla macOS (Apple Silicon) i Windows. Modele Whisper pobierane są z poziomu aplikacji."
          releaseDraft: true
          args: ${{ matrix.args }}
