name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  bundle:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            bundle_dir: target/aarch64-apple-darwin/release/bundle/dmg
            pattern: "*.dmg"
            stable_name: LectureCapture-macOS-AppleSilicon.dmg
          - platform: windows-latest
            args: --bundles nsis
            bundle_dir: C:/t/release/bundle/nsis
            pattern: "*-setup.exe"
            stable_name: LectureCapture-Windows-Setup.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      # Short target dir: ggml-vulkan's nested CMake build exceeds MSBuild's 260-char path limit
      - name: Short Cargo target dir (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: echo 'CARGO_TARGET_DIR=C:\t' >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.platform == 'windows-latest' && '. -> C:\t' || '. -> target' }}
      # Prebuilt LunarG SDK: ggml-vulkan needs glslc, which the from-source setup-vulkan-sdk lacks
      - name: Vulkan SDK (Windows GPU transcription)
        if: matrix.platform == 'windows-latest'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: "LectureCapture ${{ env.TAG }}"
          releaseBody: |
            ## Pobierz

            | System | Plik |
            |---|---|
            | macOS 15+ (Apple Silicon M1–M4) | `LectureCapture-macOS-AppleSilicon.dmg` |
            | Windows 10/11 (64‑bit) | `LectureCapture-Windows-Setup.exe` |

            Aplikacja nie jest podpisana certyfikatem Apple/Microsoft – przy pierwszym uruchomieniu system wyświetli ostrzeżenie.
            Instrukcja krok po kroku: [INSTALL.md](https://github.com/${{ github.repository }}/blob/master/INSTALL.md).

            Modele Whisper nie są dołączone – pobierasz je w aplikacji (*Modele Whisper*).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      # Stable designated requirement, so macOS permissions survive app updates
      - name: Re-sign macOS bundle (stable TCC identity)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(ls ${{ matrix.bundle_dir }}/${{ matrix.pattern }} | head -n1)
          # The bundler deletes bundle/macos/*.app after a dmg-only build; take the app from the dmg
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          app="$RUNNER_TEMP/LectureCapture.app"
          cp -R "$mnt/LectureCapture.app" "$app"
          hdiutil detach "$mnt"
          scripts/macos-stable-sign.sh "$app" "$dmg"
          gh release upload "$TAG" "$dmg" --clobber
      # Copy with a version-independent name so README can link to releases/latest/download/<name>
      - name: Upload installer with stable name
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file=$(ls ${{ matrix.bundle_dir }}/${{ matrix.pattern }} | head -n1)
          cp "$file" "${{ matrix.stable_name }}"
          gh release upload "$TAG" "${{ matrix.stable_name }}" --clobber
