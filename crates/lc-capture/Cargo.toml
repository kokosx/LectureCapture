[package]
name = "lc-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform capture backends for LectureCapture (ScreenCaptureKit, Windows Graphics Capture, WASAPI loopback, microphone)"

[dependencies]
lc-core = { path = "../lc-core" }
anyhow.workspace = true
log.workspace = true
serde.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
cpal = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11", features = ["macos_15_0"] }

[target.'cfg(windows)'.dependencies]
windows-capture = "2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_HiDpi"] }
