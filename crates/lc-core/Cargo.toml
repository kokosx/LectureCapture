[package]
name = "lc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LectureCapture core: slide detection, audio pipeline, timeline sync, storage and export"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
log.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
uuid.workspace = true
sha2.workspace = true
hex.workspace = true
png.workspace = true
ogg.workspace = true
audiopus_sys.workspace = true
zip.workspace = true
image = { version = "0.25", default-features = false, features = ["webp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true
