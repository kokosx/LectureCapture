[package]
name = "lecturecapture"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LectureCapture – local lecture recorder"
default-run = "lecturecapture"

[lib]
name = "lecturecapture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lc-core = { path = "../crates/lc-core" }
lc-capture = { path = "../crates/lc-capture" }
lc-whisper = { path = "../crates/lc-whisper" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
chrono.workspace = true
base64 = "0.22"
dirs = "6"
keepawake = "0.6"
