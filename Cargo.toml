[workspace]
resolver = "2"
members = ["crates/lc-core", "crates/lc-capture", "crates/lc-whisper", "crates/lc-cli", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kokosx/LectureCapture"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
crossbeam-channel = "0.5"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
png = "0.18"
ogg = "0.9"
audiopus_sys = "0.2.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
env_logger = "0.11"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# proc-macros / build scripts: never strip (stripped proc-macro dylibs fail to load
# with the Xcode 27 linker: "mis-aligned LINKEDIT string pool")
[profile.release.build-override]
strip = false
debug = false
